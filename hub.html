<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdisseIA — Hub</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="pagina-hub">
  <header class="cabecalho">
    <div class="painel-status">
      <h1 id="titulo-odisseia" class="titulo-marca">OdisseIA</h1>
      <section class="progresso" aria-label="Progresso">
        <p id="progresso-texto" class="progresso__texto"></p>
        <div id="progresso-barra" class="barra" role="progressbar" aria-label="Progresso da jornada" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"></div>
      </section>
    </div>
  </header>

  <main>
    <section aria-label="Estações">
      <ol id="lista-estacoes" class="estacoes"></ol>
    </section>

    <section class="destino" aria-labelledby="destino-titulo">
      <h2 id="destino-titulo" class="destino__titulo">DESTINO FINAL</h2>
      <ul id="lista-finais" class="finais"></ul>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/progresso.js"></script>
  <script src="assets/js/qr.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
