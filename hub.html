<body class="pagina-hub">
  <a class="pular" href="#conteudo-principal">Pular para o conteúdo</a>
  <header class="cabecalho">
    <a class="terminal-voltar hub-visao" href="index.html"><span class="seta seta--voltar" aria-hidden="true"></span> Visão geral</a>
    <div class="painel-status">
      <h1 id="titulo-odisseia" class="titulo-marca" data-bigode>Odisse<span class="titulo-marca__ia">IA</span> <span class="titulo-marca__pagina">Rota da jornada</span></h1>
      <section class="progresso" aria-label="Progresso">
        <p id="progresso-texto" class="progresso__texto"></p>
        <div id="progresso-barra" class="barra" role="progressbar" aria-label="Progresso da jornada" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"></div>
      </section>
      <div class="painel-status__movimento textura-movimento" aria-hidden="true"></div>
    </div>
  </header>

  <main id="conteudo-principal" tabindex="-1">
    <!-- Acesso ao scanner de QR Code: preenchido por app.js a partir do progresso. -->
    <section id="hub-scan" class="scan-acesso ficha" aria-labelledby="hub-scan-titulo"></section>

    <section class="rota" aria-labelledby="rota-titulo">
      <h2 id="rota-titulo" class="destino__titulo rota__titulo">ESTAÇÕES</h2>
      <ol id="lista-estacoes" class="estacoes"></ol>
    </section>

    <section class="destino" aria-labelledby="destino-titulo">
      <h2 id="destino-titulo" class="destino__titulo">DESTINO FINAL</h2>
      <ul id="lista-finais" class="finais"></ul>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/progresso.js"></script>
  <script src="assets/js/qr.js"></script>
  <script src="assets/js/scanner.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/bigode.js"></script>
</body>
