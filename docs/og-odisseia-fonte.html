<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>OdisseIA — arte de prévia (1200 × 630)</title>
  <!--
    Fonte da imagem assets/img/og-odisseia.png (prévia de link do WhatsApp, Discord e afins).
    Não é uma página do site: é a composição da arte, feita com os próprios recursos do projeto
    (style.css: fonte Chakra Petch local, grade de fundo, texturas de retícula e de linhas de foco e as
    cores do DESIGN.md). Para gerar de novo: abrir este arquivo no Chrome com a janela em 1200 × 630 e
    capturar a tela (por exemplo, com o DevTools: Ctrl+Shift+P > "Capture screenshot").
    Nenhum gerador de imagens foi usado.
  -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    html { font-size: 100%; scrollbar-width: none; }
    body {
      position: relative;
      width: 1200px;
      height: 630px;
      min-height: 0;
      margin: 0;
      overflow: hidden;
    }

    /* Tudo o que é desenhado fica dentro da moldura de cantos cortados (a linguagem do site). */
    .palco {
      position: absolute;
      inset: 28px;
      overflow: hidden;
      clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
    }

    /* Retícula de mangá no canto, cortada na diagonal, atrás da palavra-marca (como na abertura). */
    .reticula {
      position: absolute;
      top: 0;
      right: 0;
      width: 440px;
      height: 280px;
      clip-path: polygon(34% 0, 100% 0, 100% 100%);
      opacity: 0.5;
    }


    .marca {
      position: absolute;
      left: 44px;
      top: 38px;
      margin: 0;
      font-family: var(--fonte-titulo);
      font-weight: 700;
      font-size: 204px;
      line-height: 0.84;
      letter-spacing: -0.04em;
      color: var(--cor-texto);
      white-space: nowrap;
    }

    .marca span { color: var(--cor-destaque); }

    .frase {
      position: absolute;
      left: 52px;
      top: 214px;
      width: 640px;
      margin: 0;
      font-size: 35px;
      line-height: 1.3;
      text-wrap: balance;
      color: var(--cor-texto-secundario);
    }

    svg.arte {
      position: absolute;
      inset: 0;
      width: 1200px;
      height: 630px;
    }

    .arte text {
      font-family: var(--fonte-titulo);
      font-weight: 600;
      font-size: 21px;
      letter-spacing: 0.12em;
      fill: var(--cor-texto-secundario);
    }

    .arte .forte { font-weight: 700; fill: var(--cor-texto); }
    .arte .xbot { fill: var(--cor-xbot); font-weight: 700; }
  </style>
</head>
<body>
  <div class="palco">
    <div class="reticula textura-reticula"></div>
    <h1 class="marca">Odisse<span>IA</span></h1>
    <p class="frase">Uma jornada pela evolução dos jogos e da inteligência artificial.</p>
  </div>
